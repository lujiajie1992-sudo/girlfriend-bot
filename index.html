<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🌙 邹邹的小角落</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>if(typeof emailjs!=='undefined') emailjs.init('YOUR_PUBLIC_KEY_HERE');</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --night-bg: #040a12;
    --text-main: #b0c0d0;
    --text-soft: #7888a0;
    --text-dim: #4a5a6a;
    --bubble-her: #141e2e;
    --bubble-her-border: #1e2e42;
    --bubble-me: #18263a;
    --accent: #5a8aaa;
    --glow-soft: #c88850;
  }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: #040a12;
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Songti SC', sans-serif;
    height: 100%;
    overflow: hidden;
    color: var(--text-main);
    /* 整屏沉浸，取消键盘弹出导致的页面跳变 */
    position: fixed;
    width: 100%;
    height: 100%;
  }

  /* ═══════════════════════════════
     背景层（全屏固定）
  ═══════════════════════════════ */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(180deg, #040a12 0%, #060c14 50%, #0b1828 100%);
    overflow: hidden;
  }

  /* 月光 */
  .moon {
    position: absolute; top: 20px; right: 15%;
    width: 55px; height: 55px;
    background: radial-gradient(circle at 35% 35%, #e8eeff 0%, #c8d4f0 50%, transparent 70%);
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(200,215,245,0.2), 0 0 60px rgba(200,215,245,0.08);
    animation: moonPulse 10s ease-in-out infinite;
  }
  @keyframes moonPulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }

  /* 月光散射（窗户透进来的感觉）*/
  .moon-glow {
    position: absolute; top: 20px; right: calc(15% - 60px);
    width: 150px; height: 300px;
    background: linear-gradient(180deg, rgba(200,215,245,0.04) 0%, transparent 100%);
    transform: rotate(-20deg); transform-origin: top center;
    pointer-events: none;
  }

  /* 星星 */
  .stars { position: absolute; inset: 0; }
  .star {
    position: absolute; width: 1.5px; height: 1.5px;
    background: rgba(220,230,245,0.8); border-radius: 50%;
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* 流星 */
  .meteor {
    position: absolute; width: 80px; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.6), transparent);
    border-radius: 1px;
    animation: meteorFly 1.2s ease-out forwards;
    opacity: 0;
  }
  @keyframes meteorFly {
    0% { opacity: 0; transform: translateX(0) translateY(0); }
    10% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-120px) translateY(80px); }
  }

  /* 雨滴 */
  .rain-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .raindrop {
    position: absolute; top: -30px;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(150,185,215,0.25));
    border-radius: 1px;
    animation: rainFall var(--dur, 2s) linear infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0;
  }
  @keyframes rainFall {
    0% { opacity: 0; transform: translateY(0); }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(110vh); }
  }

  /* 落叶 */
  .leaf {
    position: absolute; top: -20px;
    width: 8px; height: 5px;
    background: rgba(30,50,30,0.6);
    border-radius: 50% 0 50% 0;
    animation: leafDrift var(--dur, 6s) linear infinite;
    animation-delay: var(--delay, 0s);
    opacity: 0;
  }
  @keyframes leafDrift {
    0% { opacity: 0; transform: translate(0,0) rotate(0deg); }
    10% { opacity: 0.7; }
    80% { opacity: 0.5; }
    100% { opacity: 0; transform: translate(50px, 105vh) rotate(400deg); }
  }

  /* 便利店底部暖光 */
  .conveni {
    position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background:
      radial-gradient(ellipse 40% 100% at 15% 100%, rgba(255,170,60,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 30% 80% at 85% 100%, rgba(255,155,45,0.05) 0%, transparent 70%),
      linear-gradient(180deg, transparent 0%, rgba(255,150,50,0.02) 100%);
    animation: conveniFlicker 10s ease-in-out infinite;
  }
  @keyframes conveniFlicker {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* ═══════════════════════════════
     内容层
  ═══════════════════════════════ */
  .content {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    overscroll-behavior: none;
  }

  /* 顶部 */
  .header {
    flex-shrink: 0; padding: 20px 20px 10px;
    text-align: center;
    background: linear-gradient(180deg, rgba(4,10,18,0.8) 0%, transparent 100%);
  }
  .header h1 { font-size: 18px; color: #d8c8a8; font-weight: 400; letter-spacing: 4px; }
  .header .sub { font-size: 10px; color: var(--text-dim); margin-top: 4px; letter-spacing: 1px; }

  /* 卡片 */
  .encourage-card {
    flex-shrink: 0; margin: 0 16px 6px;
    background: rgba(20,32,48,0.5);
    border: 1px solid rgba(80,110,140,0.08);
    border-radius: 12px; padding: 9px 16px; text-align: center;
  }
  .encourage-card .e-label { font-size: 9px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 3px; opacity: 0.5; }
  .encourage-card .e-text { font-size: 13px; color: var(--glow-soft); line-height: 1.7; }

  .quote-card {
    flex-shrink: 0; margin: 0 16px 6px;
    background: rgba(20,32,48,0.3);
    border: 1px solid rgba(80,110,140,0.05);
    border-radius: 12px; padding: 9px 16px; text-align: center;
  }
  .quote-card .q-text { font-size: 12px; color: var(--text-soft); line-height: 1.8; font-style: italic; margin-bottom: 4px; }
  .quote-card .q-author { font-size: 10px; color: var(--text-dim); letter-spacing: 0.5px; }

  /* 呆呆熊身份栏 */
  .bear-zone {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 6px 20px;
    border-bottom: 1px solid rgba(80,110,140,0.04);
  }
  .bear-icon {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #1a2a3c, #243650);
    border: 1px solid rgba(80,110,140,0.12);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .bear-info .name { font-size: 13px; color: #c8b898; font-weight: 400; letter-spacing: 1px; }
  .bear-info .desc { font-size: 10px; color: var(--text-dim); letter-spacing: 0.3px; }

  /* 聊天区 */
  .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }

  .chat-container {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    overscroll-behavior: none;
  }
  .chat-container::-webkit-scrollbar { width: 0; }

  .msg { display: flex; gap: 7px; max-width: 80%; animation: fadeUp 0.25s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.her { align-self: flex-start; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }

  .msg-avatar {
    width: 27px; height: 27px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    align-self: flex-end;
  }
  .msg.her .msg-avatar { background: linear-gradient(135deg, #1a2a3c, #243650); border: 1px solid rgba(80,110,140,0.1); }
  .msg.me .msg-avatar { background: linear-gradient(135deg, #1e3a5f, #162840); border: 1px solid rgba(80,110,140,0.08); }

  .bubble {
    padding: 9px 13px; border-radius: 14px;
    font-size: 14px; line-height: 1.7; word-break: break-word;
  }
  .msg.her .bubble {
    background: var(--bubble-her); color: var(--text-main);
    border: 1px solid var(--bubble-her-border);
    border-top-left-radius: 2px;
  }
  .msg.me .bubble {
    background: var(--bubble-me); color: #c0d8e8;
    border-top-right-radius: 2px;
  }

  .typing { display: flex; align-items: center; gap: 5px; color: var(--text-dim); font-size: 12px; padding: 3px 0; }
  .dots { display: flex; gap: 3px; }
  .dots span { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite; opacity: 0.5; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-3px); }
  }

  /* 输入区 */
  .input-zone {
    flex-shrink: 0;
    background: rgba(4,10,18,0.85);
    backdrop-filter: blur(20px);
    padding: 10px 14px max(10px, env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: flex-end;
    border-top: 1px solid rgba(80,110,140,0.05);
  }
  .input-zone input {
    flex: 1; border: 1px solid rgba(80,110,140,0.12); border-radius: 22px;
    padding: 10px 16px; font-size: 14px; outline: none;
    background: rgba(20,32,48,0.6); color: var(--text-main);
    transition: border-color 0.2s;
    /* 整屏沉浸感：输入框不改变布局 */
  }
  .input-zone input:focus { border-color: rgba(80,110,140,0.28); }
  .input-zone input::placeholder { color: var(--text-dim); }
  .send-btn {
    width: 40px; height: 40px; flex-shrink: 0;
    background: linear-gradient(135deg, #1a2a3c, #243650);
    border: 1px solid rgba(80,110,140,0.15); border-radius: 50%;
    font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
  }
  .send-btn:hover { transform: scale(1.06); }
  .send-btn:active { transform: scale(0.95); }

  /* 声音按钮 */
  .sound-btn {
    position: fixed; bottom: max(76px, calc(70px + env(safe-area-inset-bottom))); right: 14px; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(12,20,32,0.85);
    border: 1px solid rgba(80,110,140,0.12);
    color: var(--accent); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; backdrop-filter: blur(10px);
  }
  .sound-btn:hover { transform: scale(1.1); border-color: rgba(80,110,140,0.25); }
  .sound-btn.playing { color: #e0a060; border-color: rgba(224,160,96,0.25); }

  /* 邮箱弹窗 */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: linear-gradient(135deg, #111e2e, #0b1520);
    border: 1px solid rgba(80,110,140,0.1); border-radius: 18px;
    width: 90%; max-width: 360px; padding: 24px 20px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal-box .m-title { font-size: 15px; color: #c8b898; text-align: center; letter-spacing: 1px; }
  .modal-box p { font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.6; }
  .modal-box input {
    width: 100%; border: 1px solid rgba(80,110,140,0.15); border-radius: 14px;
    padding: 11px 14px; font-size: 14px; outline: none;
    background: rgba(20,32,48,0.5); color: var(--text-main);
  }
  .modal-box input:focus { border-color: rgba(80,110,140,0.3); }
  .m-btns { display: flex; gap: 10px; }
  .m-btn {
    flex: 1; padding: 10px; border-radius: 20px;
    border: 1px solid rgba(80,110,140,0.12); background: transparent;
    color: var(--text-soft); font-size: 14px; cursor: pointer;
  }
  .m-btn-solid {
    flex: 1; padding: 10px; border-radius: 20px; border: none;
    background: linear-gradient(135deg, #1a2a3c, #243650);
    color: var(--accent); font-size: 14px; cursor: pointer;
  }
  .m-btn:disabled, .m-btn-solid:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<!-- 背景 -->
<div class="bg">
  <div class="moon"></div>
  <div class="moon-glow"></div>
  <div class="stars" id="stars"></div>
  <div class="rain-layer" id="rainLayer"></div>
  <div class="leaf-layer" id="leafLayer"></div>
  <div class="conveni"></div>
</div>

<!-- 内容 -->
<div class="content">

  <div class="header">
    <h1>🌙 邹邹</h1>
    <div class="sub" id="countdownSub">距离高考</div>
  </div>

  <div class="encourage-card">
    <div class="e-label">✨ 今天的你</div>
    <div class="e-text" id="encourageText">不管今天多累，你已经做得很好了 🤍</div>
  </div>

  <div class="quote-card">
    <div class="q-text" id="quoteText">「加载中...」</div>
    <div class="q-author" id="quoteAuthor"></div>
  </div>

  <div class="bear-zone">
    <div class="bear-icon">🧸</div>
    <div class="bear-info">
      <div class="name">呆呆熊</div>
      <div class="desc">只陪伴邹邹的呆呆熊</div>
    </div>
  </div>

  <div class="main">
    <div class="chat-container" id="chatContainer"></div>
  </div>

  <div class="input-zone">
    <input type="text" id="msgInput" placeholder="说点什么啦邹邹..." autocomplete="off" />
    <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
  </div>

</div>

<!-- 声音按钮 -->
<button class="sound-btn" id="soundBtn" onclick="toggleSound()">🌧</button>

<!-- 邮箱弹窗 -->
<div class="modal" id="emailModal">
  <div class="modal-box">
    <div class="m-title">📧 发送到邮箱</div>
    <p>日记将整理成带时间戳的文档，发送到邹邹的邮箱</p>
    <input type="email" id="exportEmail" placeholder="邹邹的邮箱地址" />
    <div class="m-btns">
      <button class="m-btn" onclick="closeEmailModal()">取消</button>
      <button class="m-btn-solid" id="sendEmailBtn" onclick="sendDiaryToEmail()">发送</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════
// 背景动画：星星
// ═══════════════════════════════
(function(){
  const container = document.getElementById('stars');
  const positions = [
    [5,6],[12,14],[20,4],[28,18],[35,10],[42,22],[50,7],[58,16],[65,3],[72,20],[80,12],[88,8],[92,18],
    [8,28],[18,35],[25,30],[33,40],[45,32],[52,38],[60,28],[68,36],[75,30],[82,40],[90,34],
    [10,48],[20,52],[30,46],[40,55],[50,50],[60,56],[70,48],[80,54],[88,50],
    [3,62],[15,60],[28,65],[38,58],[48,64],[58,60],[68,66],[78,58],[90,63]
  ];
  positions.forEach(([x,y], i) => {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${x}%;top:${y}%;--dur:${2+Math.random()*3}s;--delay:${Math.random()*4}s;opacity:${0.3+Math.random()*0.5}`;
    container.appendChild(s);
  });
})();

// ═══════════════════════════════
// 背景动画：雨滴
// ═══════════════════════════════
(function(){
  const container = document.getElementById('rainLayer');
  for(let i=0; i<40; i++){
    const d = document.createElement('div');
    d.className = 'raindrop';
    d.style.cssText = `
      left:${Math.random()*100}%;
      --dur:${1.5+Math.random()*2.5}s;
      --delay:${Math.random()*4}s;
      height:${8+Math.random()*12}px;
      opacity:0;
    `;
    container.appendChild(d);
  }
})();

// ═══════════════════════════════
// 背景动画：落叶
// ═══════════════════════════════
(function(){
  const container = document.getElementById('leafLayer');
  if(!container) return;
  for(let i=0; i<12; i++){
    const d = document.createElement('div');
    d.className = 'leaf';
    d.style.cssText = `
      left:${Math.random()*100}%;
      --dur:${5+Math.random()*5}s;
      --delay:${Math.random()*8}s;
      opacity:0;
    `;
    container.appendChild(d);
  }
})();

// ═══════════════════════════════
// 流星：从右上 → 左下，斜着划
// ═══════════════════════════════
(function spawnMeteor(){
  const bg = document.querySelector('.bg');
  if(!bg) return;
  const m = document.createElement('div');
  m.className = 'meteor';
  // 随机起始位置（右上区域），向左侧下方划过
  const startX = 50 + Math.random() * 45; // 50%-95% x
  const startY = 3 + Math.random() * 25;  // 3%-28% y
  m.style.cssText = `top:${startY}%;left:${startX}%;width:${50+Math.random()*50}px`;
  bg.appendChild(m);
  setTimeout(() => { m.remove(); }, 1500);
  setTimeout(spawnMeteor, 4000 + Math.random()*7000);
})();

// ═══════════════════════════════
// 每日鼓励语
// ═══════════════════════════════
const encouragements = [
  "不管今天多累，你已经做得很好了 🤍",
  "你值得被好好爱着，包括被自己爱",
  "今天也很努力了，真的很棒哦",
  "慢慢来，你已经在正确的路上了",
  "累了就休息，你不是一个人在扛",
  "高考只是人生一小步，你已经很勇敢了",
  "相信自己，你比自己以为的更强大",
  "今天也要好好吃饭，好好睡觉，好好生活",
  "你存在本身，就是一件很美好的事",
  "每一个不曾放弃的日子，都是勋章",
  "不管结果如何，你都值得被拥抱",
  "今天的你，比昨天又进步了一点点",
  "难过的时候，记得你还有呆呆熊",
  "你不需要成为谁，做自己就好",
  "这个世界因为有邹邹，又温柔了一点",
  "你已经比昨天的自己更强了",
  "累了就躺平一下，这不丢人",
  "不管怎样，我都在哦 🤍",
  "今天也是独一无二的你，好好珍惜",
  "你值得所有美好的事物",
  "每一个小进步，都值得被庆祝",
  "高考倒计时里，别忘了好好生活",
  "你比自己想象中更勇敢，更温柔",
  "今天也要开开心心的哦",
  "相信自己，你走的每一步都算数",
  "不管发生什么，呆呆熊都陪着你",
  "累了就哭一下，眼泪不是软弱",
  "邹邹，今天也要好好吃饭哦",
  "每一步路都不会白走，相信过程"
];
const today = new Date();
const encIdx = (today.getMonth()*31 + today.getDate()) % encouragements.length;
document.getElementById('encourageText').textContent = encouragements[encIdx];

// ═══════════════════════════════
// 每日文学语录
// ═══════════════════════════════
const quotes = [
  ["我用什么才能留住你？我给你贫穷的街道、绝望的落日、破败郊区的月亮。", "博尔赫斯"],
  ["如果有来生，要做一棵树，站成永恒。没有悲欢的姿势。", "三毛《说给自己听》"],
  ["城市不会泄露自己的过去，只会把它像掌纹一样藏起来。", "卡尔维诺《看不见的城市》"],
  ["我们听过无数的道理，却仍旧过不好这一生。", "韩寒"],
  ["刻意去找的东西，往往是找不到的。天下万物的来和去，都有它的时间。", "三毛"],
  ["一个人至少拥有一个梦想，有一个理由去坚强。", "三毛《哭泣的骆驼》"],
  ["使我们有别于他人的，不在于我们看见什么，而在于我们如何看见。", "博尔赫斯"],
  ["时间流逝的目的只有一个：让感觉和思想稳定下来，成熟起来。", "卡尔维诺"],
  ["One must imagine Sisyphus happy. 人必须想象西西弗斯是幸福的。", "Albert Camus"],

// ═══════════════════════════════
// 聊天
// ═══════════════════════════════
const chatContainer = document.getElementById('chatContainer');
const msgInput = document.getElementById('msgInput');
let chatHistory = JSON.parse(localStorage.getItem('zz_chat_v3') || '[]');
chatHistory.forEach(m => addMsg(m.text, m.who, false));

function addMsg(text, who, save = true) {
  const d = document.createElement('div');
  d.className = `msg ${who}`;
  const avatar = who === 'her' ? '🧸' : '🐻';
  d.innerHTML = `<div class="msg-avatar">${avatar}</div><div class="bubble">${esc(text)}</div>`;
  chatContainer.appendChild(d);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  if (save) {
    chatHistory.push({ text, who, ts: Date.now() });
    localStorage.setItem('zz_chat_v3', JSON.stringify(chatHistory));
  }
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'msg her';
  d.id = 'typing';
  d.innerHTML = `<div class="msg-avatar">🧸</div><div class="bubble"><div class="typing"><div class="dots"><span></span><span></span><span></span></div>呆呆熊在思考...</div></div>`;
  chatContainer.appendChild(d);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}
function removeTyping() { document.getElementById('typing')?.remove(); }

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

async function sendMsg() {
  const text = msgInput.value.trim();
  if (!text) return;
  msgInput.value = '';
  addMsg(text, 'me');
  saveChatEntry(text, 'me');
  showTyping();

  if((text.includes('导出') && text.includes('日记')) || text.includes('发到邮箱') || text.includes('发送日记')){
    removeTyping();
    addMsg('好的呀～请告诉邹邹的邮箱地址，我帮你发过去哦 📧\n\n（格式像这样：zouzou@qq.com）', 'her');
    return;
  }

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    removeTyping();
    const reply = data.reply || '嗯...出了点小状况 😢';
    addMsg(reply, 'her');
    saveChatEntry(text, 'me', reply);
  } catch(e) {
    removeTyping();
    addMsg('网络好像有点问题呢 😢', 'her');
  }
}

msgInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendMsg(); });

setTimeout(() => {
  addMsg('嗨～我是呆呆熊 🤍<br>这里是专属于你的小角落。<br>想说就说，我都在哦 ✨', 'her');
}, 600);

function saveChatEntry(user, who, ai = null) {
  let entries = JSON.parse(localStorage.getItem('zz_diary_v3') || '[]');
  const entry = { id: Date.now(), ts: new Date().toISOString(), user, ai };
  entries.unshift(entry);
  localStorage.setItem('zz_diary_v3', JSON.stringify(entries));
}

// 邮箱
// ═══════════════════════════════
function openEmailModal() {
  document.getElementById('emailModal').classList.add('open');
  document.getElementById('exportEmail').focus();
}
function closeEmailModal() {
  document.getElementById('emailModal').classList.remove('open');
  document.getElementById('exportEmail').value = '';
}

function sendDiaryToEmail() {
  const email = document.getElementById('exportEmail').value.trim();
  if (!email || !email.includes('@')) { alert('请填写正确的邮箱地址哦 📧'); return; }
  const btn = document.getElementById('sendEmailBtn');
  btn.textContent = '发送中...'; btn.disabled = true;

  if (typeof emailjs === 'undefined' || emailjs.params?.user_id === 'YOUR_PUBLIC_KEY_HERE') {
    alert('📧 邮箱发送功能需要先配置！\n\n请告诉佳杰哥哥，让他帮你设置 EmailJS 就可以用啦~');
    btn.textContent = '发送'; btn.disabled = false;
    return;
  }

  const entries = JSON.parse(localStorage.getItem('zz_diary_v3') || '[]');
  if (entries.length === 0) { alert('树洞里还没有内容呢，先聊几句吧～'); btn.textContent = '发送'; btn.disabled = false; return; }

  const diaryText = entries.map(e => {
    const d = new Date(e.ts);
    const ds = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    return `[${ds}]\n邹邹说：${e.user}${e.ai ? '\n🧸 呆呆熊：' + e.ai : ''}`;
  }).join('\n\n---\n\n');

  emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', {
    to_email: email, diary_content: diaryText, to_name: '邹邹',
    send_time: new Date().toLocaleString('zh-CN')
  }).then(() => {
    alert(`📧 日记已发送到 ${email}！\n记得去邮箱查收哦～`);
    closeEmailModal();
  }).catch(() => { alert('发送失败了 😢 请稍后再试'); })
    .finally(() => { btn.textContent = '发送'; btn.disabled = false; });
}

// ═══════════════════════════════
// 真正的自然下雨声：录制的雨音
// 用Audio元素 + Web Audio API混合处理
// 模拟窗外毛毛细雨的安静感觉
// ═══════════════════════════════
let audioEl = null;
let audioCtx = null;
let isPlaying = false;

function startRainSound() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) { return; }

  // 用项目本地录制的粉红噪音（接近自然雨声）
  audioEl.src = '/rain_natural.wav';
  audioEl.loop = true;
  audioEl.volume = 0.12; // 音量极轻

  // 通过Web Audio API处理，变得更轻柔
  const source = audioCtx.createMediaElementSource(audioEl);

  // 高通滤波：去掉低频轰鸣
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 200;

  // 低通滤波：去掉高频杂音
  const lp = audioCtx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 5000;

  // 最终增益：极轻
  const gain = audioCtx.createGain();
  gain.gain.value = 0.5;

  source.connect(hp); hp.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination);

  audioEl.play().catch(() => {
    // 如果自动播放失败（微信限制），静默处理
  });

  isPlaying = true;
  document.getElementById('soundBtn').classList.add('playing');
}

function stopRainSound() {
  if(audioEl) { audioEl.pause(); audioEl = null; }
  if(audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
  isPlaying = false;
  document.getElementById('soundBtn').classList.remove('playing');
}

function toggleSound() {
  if(isPlaying) { stopRainSound(); }
  else { startRainSound(); }
}
</script>
